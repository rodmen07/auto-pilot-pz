name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this suite only reads the checked-out tree. Nothing here
# needs write access to contents, releases, packages, issues, or checks, so the
# job token is narrowed explicitly rather than inherited from the repo default
# (a repo-level default change would otherwise silently widen it).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # THE luacheck PIN.  Declared once, here, and read by BOTH the install step
    # and the pin guard that follows it, so there is exactly one place to bump
    # and nothing to keep in sync.  `luarocks install luacheck` with no version
    # installs whatever luarocks serves that day: a new upstream release can
    # therefore turn an unrelated pull request red overnight, and a dev box's
    # luacheck can silently disagree with the one that judges the merge.  Bump
    # this deliberately, exactly like the action SHA pins above.
    #
    # tests/test_luacheck_pin.py reads this value out of the yaml and executes
    # the guard's real script, so the pin cannot rot into decoration.
    env:
      LUACHECK_VERSION: "1.2.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog guard below diffs this branch against its base, which
          # needs the base commit and a merge base -- neither exists in the
          # default depth-1 checkout.  This repo is 206 commits / 13 MB, so the
          # full history costs about a second.  tests/test_changelog_guard.py
          # asserts this line still says 0, because losing it turns the guard
          # into a step that errors instead of one that judges.
          fetch-depth: 0

      # Runs before the ~25s toolchain install so a supply-chain regression
      # fails fast.
      - name: Action pin guard
        run: |
          echo "=== Action pin guard: external actions must be pinned to a full commit SHA ==="
          UNPINNED=0
          TOTAL=0
          MATCHED=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            MATCHED=$((MATCHED + 1))
            spec="${line#*uses:}"
            spec="$(printf '%s' "$spec" | tr -d '\r' | awk '{print $1}')"
            [ -n "$spec" ] || continue
            case "$spec" in
              ./*) echo "  SKIP     $spec (local reusable workflow, no SHA to pin)"; continue ;;
            esac
            TOTAL=$((TOTAL + 1))
            ref="${spec##*@}"
            if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "  OK       $spec"
            else
              echo "  UNPINNED $spec"
              UNPINNED=$((UNPINNED + 1))
            fi
          done <<< "$(grep -rhE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]' .github/workflows/)"
          if [ "$MATCHED" -eq 0 ]; then
            echo "ERROR: no 'uses:' lines found under .github/workflows/."
            echo "The guard has gone blind (moved/renamed workflows?) — it must never pass on zero input."
            exit 1
          fi
          echo "Checked $TOTAL external action reference(s); $UNPINNED unpinned."
          if [ "$UNPINNED" -gt 0 ]; then
            echo "Action pin guard FAILED: pin every external action to a full 40-hex commit SHA,"
            echo "e.g. actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1"
            echo "A mutable tag (@v7) can be re-pointed at new code by the action owner or by a"
            echo "compromise of their repo, silently changing what runs in CI and in the release job."
            exit 1
          fi
          echo "Action pin guard PASSED: every external action is pinned to a commit SHA."

      # Also fails fast, before the toolchain install.  PULL REQUESTS ONLY: on a
      # push to main there is no base branch to diff against, and the squash
      # commit already carries both halves of whatever the PR changed.
      #
      # Exercised on every push and PR by tests/test_changelog_guard.py, which
      # extracts THIS script out of the yaml and runs it against synthetic git
      # repositories, so the guard cannot rot into an inert surface the way
      # release.yml's version gate did (see tests/test_release_gate.py).
      - name: Changelog guard
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Changelog guard: shipped client Lua must ship with a CHANGELOG entry ==="
          BASE_REF="${GITHUB_BASE_REF:-main}"
          BASE="origin/${BASE_REF}"
          if ! git rev-parse --verify --quiet "${BASE}" >/dev/null; then
            BASE="${BASE_REF}"
          fi
          if ! git rev-parse --verify --quiet "${BASE}" >/dev/null; then
            echo "ERROR: cannot resolve the base branch (tried origin/${BASE_REF} and ${BASE_REF})."
            echo "The guard has gone blind; it must never pass without a base to diff against."
            exit 1
          fi
          MERGE_BASE="$(git merge-base "${BASE}" HEAD)" || MERGE_BASE=""
          if [ -z "${MERGE_BASE}" ]; then
            echo "ERROR: no merge base between ${BASE} and HEAD."
            echo "actions/checkout needs fetch-depth: 0 here; a guard that cannot see the"
            echo "history must fail, not pass."
            exit 1
          fi
          CHANGED="$(git diff --name-only "${MERGE_BASE}" HEAD)"
          if [ -z "${CHANGED}" ]; then
            echo "ERROR: this branch changes no files against ${BASE}."
            echo "A guard that reports success on zero input is worse than no guard."
            exit 1
          fi
          echo "Changed file(s) against ${BASE}:"
          printf '%s\n' "${CHANGED}" | sed 's/^/  /'
          LUA="$(printf '%s\n' "${CHANGED}" | grep -E '^42/media/lua/client/.+\.lua$' || true)"
          if [ -z "${LUA}" ]; then
            echo "Changelog guard PASSED: no shipped client Lua changed."
            exit 0
          fi
          if printf '%s\n' "${CHANGED}" | grep -qx 'CHANGELOG.md'; then
            echo "Changelog guard PASSED: CHANGELOG.md changed alongside the shipped code."
            exit 0
          fi
          if git log --format=%B "${MERGE_BASE}..HEAD" | grep -qF '[no changelog]'; then
            echo "Changelog guard PASSED BY OVERRIDE: a commit message carries [no changelog]."
            echo "That override is for changes with no user-visible effect only, and it stays"
            echo "in the git log where a reviewer can see it."
            exit 0
          fi
          echo "Changelog guard FAILED: shipped client Lua changed with no CHANGELOG.md entry:"
          printf '%s\n' "${LUA}" | sed 's/^/  /'
          echo
          echo "CHANGELOG.md is this project's authoritative shipped record and release notes"
          echo "are cut from it.  Between PR #74 and PR #101 SEVEN merged PRs changed"
          echo "42/media/lua/client/ and never touched it (#84, #88, #89, #90, #92, #100,"
          echo "#101), so an entire approved milestone was missing from the record days"
          echo "before its release was due to be cut."
          echo
          echo "Fix: add an entry under '## [Unreleased]' in CHANGELOG.md, or put"
          echo "[no changelog] in a commit message if the change truly has no user-visible"
          echo "effect."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck "${LUACHECK_VERSION}"

      # The pin above only helps if the binary that actually runs IS the pinned
      # one.  A luarocks fallback, a stale runner-image rock, or a typo'd
      # version would otherwise leave a different linter judging the merge while
      # the yaml still claims a pin.  Exercised headlessly on every push and PR
      # by tests/test_luacheck_pin.py, which extracts THIS script and runs it
      # against fake `luacheck` binaries in both directions.
      - name: Luacheck pin guard
        run: |
          echo "=== Luacheck pin guard: the linter that runs must be the pinned version ==="
          EXPECTED="${LUACHECK_VERSION:-}"
          if [ -z "$EXPECTED" ]; then
            echo "ERROR: LUACHECK_VERSION is unset, so there is no pin to check."
            echo "The guard has gone blind; it must never pass without a pin."
            exit 1
          fi
          RAW="$(luacheck --version 2>/dev/null | head -n 1 || true)"
          INSTALLED="$(printf '%s' "$RAW" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1 || true)"
          if [ -z "$INSTALLED" ]; then
            echo "ERROR: no version could be read out of 'luacheck --version' (got: '${RAW}')."
            echo "The guard has gone blind; it must never pass without a version to compare."
            exit 1
          fi
          if [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "Luacheck pin guard FAILED: installed ${INSTALLED}, pinned ${EXPECTED}."
            echo
            echo "The linter that judges this merge is not the one the workflow pins."
            echo "Either the install step did not honour the pin, or LUACHECK_VERSION was"
            echo "changed without checking what luarocks actually serves.  Do not relax the"
            echo "guard: a linter that drifts silently can redden unrelated pull requests"
            echo "overnight, and it makes local runs disagree with CI about the same code."
            exit 1
          fi
          echo "Luacheck pin guard PASSED: luacheck ${INSTALLED} matches the pin."

      - name: Lua lint
        run: luacheck 42/media/lua/client/*.lua --config .luacheckrc

      - name: Static API Guard
        run: |
          echo "=== Static API Guard: checking for deprecated PZ APIs ==="
          DEPRECATED_PATTERNS=(
            ":getHunger()"
            ":getThirst()"
            ":getFatigue()"
            ":getEndurance()"
            "CharacterStats\."
          )
          FOUND=0
          for pattern in "${DEPRECATED_PATTERNS[@]}"; do
            if grep -rn --include="*.lua" -- "$pattern" 42/media/lua/client/; then
              echo "ERROR: Deprecated API pattern found: $pattern"
              FOUND=$((FOUND + 1))
            fi
          done
          if [ "$FOUND" -gt 0 ]; then
            echo "Static API Guard FAILED: $FOUND deprecated pattern(s) detected."
            echo "Use player:getStats():get(CharacterStat.X) instead of direct stat getters."
            exit 1
          fi
          echo "Static API Guard PASSED: no deprecated APIs detected."

      - name: Lua logic tests
        run: |
          shopt -s nullglob
          test_files=(tests/test_*.lua)
          shopt -u nullglob
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "ERROR: no Lua test files found matching tests/test_*.lua"
            echo "Test discovery is glob-driven; zero matches means the suite is missing."
            exit 1
          fi
          echo "Discovered ${#test_files[@]} Lua test file(s)."
          for test_file in "${test_files[@]}"; do
            echo "=== $test_file ==="
            lua5.1 "$test_file"
          done

      - name: Python tests
        run: python -m pytest tests/ -v
