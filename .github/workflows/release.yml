name: Release

# Trigger a GitHub release whenever a version tag is pushed.
# Tag format: v<semver> — e.g. v1.1.0, v1.2.3-beta1
on:
  push:
    tags:
      - "v*"

jobs:
  # ── CI gate ──────────────────────────────────────────────────────────────────
  # Run the full lint-and-test suite before packaging.  A broken tag cannot
  # produce a release artifact.
  lint-and-test:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Package & publish
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    permissions:
      contents: write   # required to create releases and upload assets

    # Everything derived from the pushed tag is computed ONCE, here, and reaches
    # the steps below through the environment.  Three reasons:
    #
    #   1. Security.  git permits `;`, `$` and backticks in a ref name, so a tag
    #      interpolated straight into a `run:` body is the documented Actions
    #      script-injection shape, and this job holds `contents: write`.
    #      `tests/test_release_gate.py` fails the build if ANY `run:` body in
    #      this file grows a `${{ }}` again.
    #   2. Correctness.  The archive name used to be spelled out by hand in
    #      three separate places (the zip target, the integrity check and the
    #      release upload), so editing one and missing another would publish a
    #      file that was never built.  There is exactly one definition now, and
    #      the guard asserts that archive-name prefix appears nowhere else in
    #      this file.
    #   3. Testability.  With these in the environment the step scripts run
    #      outside Actions unchanged, which is what `tests/test_release_gate.py`
    #      does on every PR.  This job runs ONLY on a tag push (USER-ONLY here),
    #      so nothing below the CI gate had ever been executed by anything.
    env:
      TAG_NAME: ${{ github.ref_name }}
      ARCHIVE_NAME: AutoPilot-${{ github.ref_name }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version tag matches mod.info
        # Reads TAG_NAME from the job-level env block above.  This step had been
        # unreleasable since the modversion reset to 0.1.0 and nothing had ever
        # run it; tests/test_release_gate.py now runs it on every PR.
        run: |
          # Compare the tag against 42/mod.info's `modversion=` after padding
          # both to major.minor.patch, so the two-component scheme this repo
          # used historically (5.8) and the three-component scheme it uses now
          # (0.1.0) both work.
          #
          # The previous version truncated the TAG to major.minor and compared
          # that against the RAW modversion, so once modversion had three
          # components no tag could match it at all: the left side can never
          # contain two dots, so "0.1" != "0.1.0" for every possible tag name.
          pad_to_three() {
            _v="$1"
            case "$_v" in
              *.*.*) : ;;                 # already major.minor.patch or longer
              *.*)   _v="${_v}.0" ;;      # major.minor
              *)     _v="${_v}.0.0" ;;    # major only
            esac
            printf '%s' "$_v"
          }

          TAG_VER="${TAG_NAME#v}"      # strip leading v:            v0.1.0 -> 0.1.0
          TAG_VER="${TAG_VER%%-*}"     # strip prerelease/metadata:  0.1.0-beta1 -> 0.1.0

          MOD_VER="$(grep '^modversion=' 42/mod.info | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "${MOD_VER}" ]; then
            echo "ERROR: no modversion= line found in 42/mod.info."
            exit 1
          fi

          TAG_NORM="$(pad_to_three "${TAG_VER}")"
          MOD_NORM="$(pad_to_three "${MOD_VER}")"

          echo "Tag:                 ${TAG_NAME}  (version ${TAG_VER}, normalized ${TAG_NORM})"
          echo "42/mod.info version: ${MOD_VER}  (normalized ${MOD_NORM})"

          if [ "${TAG_NORM}" != "${MOD_NORM}" ]; then
            echo "ERROR: Version mismatch. Tag ${TAG_NAME} normalizes to ${TAG_NORM}, but"
            echo "42/mod.info says ${MOD_VER} (normalized ${MOD_NORM})."
            echo "Update modversion in 42/mod.info before tagging, or push a matching tag."
            exit 1
          fi
          echo "Version check PASSED: tag and mod.info both report ${MOD_NORM}."

      - name: Build mod archive
        run: |
          # Package the 42/ folder (everything the game needs) plus documentation.
          # ARCHIVE_NAME comes from the job-level env block: never interpolate a
          # ref name into a shell body, and never re-spell the archive name.
          zip -r "${ARCHIVE_NAME}" 42/ docs/ CHANGELOG.md

      - name: Verify archive contents
        run: |
          ARCHIVE="${ARCHIVE_NAME}"
          echo "=== Archive contents ==="
          unzip -l "${ARCHIVE}"

          # Assert required files are present.
          REQUIRED=(
            "42/mod.info"
            "42/media/lua/client/AutoPilot_Main.lua"
            "42/media/lua/client/AutoPilot_Needs.lua"
            "42/media/lua/client/AutoPilot_Threat.lua"
            "42/media/lua/client/AutoPilot_Inventory.lua"
            "42/media/lua/client/AutoPilot_Medical.lua"
            "42/poster.png"
            "docs/architecture.md"
            "CHANGELOG.md"
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if ! unzip -l "${ARCHIVE}" | grep -q "${f}"; then
              echo "ERROR: Required file missing from archive: ${f}"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "${MISSING}" -gt 0 ]; then
            echo "Archive integrity check FAILED: ${MISSING} required file(s) missing."
            exit 1
          fi

          # Assert dev-only artefacts are NOT bundled.
          DEV_PATTERNS=(".luacheckrc" "tests/" "requirements" ".github" "automate.py"
                        "auto_tune.py" "benchmark.py")
          DEV_FOUND=0
          for pat in "${DEV_PATTERNS[@]}"; do
            if unzip -l "${ARCHIVE}" | grep -q "${pat}"; then
              echo "ERROR: Dev-only file found in archive: ${pat}"
              DEV_FOUND=$((DEV_FOUND + 1))
            fi
          done
          if [ "${DEV_FOUND}" -gt 0 ]; then
            echo "Archive integrity check FAILED: ${DEV_FOUND} dev file(s) accidentally bundled."
            exit 1
          fi

          echo "Archive integrity check PASSED."

      - name: Verify no anthropic import in Python sources
        # Guards the removed LLM-sidecar architecture: nothing may reintroduce
        # the Anthropic SDK into this repo's Python surface.  Catches BOTH
        # import shapes -- the original pattern was the fixed string
        # "import anthropic", which misses the modern SDK style
        # `from anthropic import Anthropic` (case-sensitive: the text after
        # "import " there is the class name, not the module).  The trailing
        # bracket class keeps lookalike modules (anthropic_utils) legal.
        # tests/test_release_gate.py executes this body on every PR, in both
        # directions, so the step can never go dead again.
        run: |
          echo "=== Checking for removed anthropic dependency ==="
          if grep -rnE --include="*.py" "^[[:space:]]*(import|from)[[:space:]]+anthropic([.[:space:]]|$)" .; then
            echo "ERROR: anthropic import found. The removed LLM sidecar must not come back."
            exit 1
          fi
          echo "PASSED: no anthropic imports detected."

      - name: Create GitHub Release
        # Third-party action running with `contents: write` — the highest-risk
        # supply-chain surface in this repo, so it is pinned by commit SHA.
        # Dependabot (see .github/dependabot.yml) bumps the SHA + version comment.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The same single definition the two steps above package and verify,
          # so the release can never upload a name that was never built.  An
          # action INPUT is not a shell body, so this interpolation is not the
          # injection shape; it is here for the one-definition property.
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
